<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Gesture Particle System</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #05060a;
    --panel: rgba(12, 14, 22, 0.72);
    --text: #e8ecf5;
    --muted: #8a93a8;
    --accent: #7dd3fc;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      /* Canvas stays dark for particle contrast; only UI panel adapts */
      --panel: rgba(255, 255, 255, 0.82);
      --text: #111422;
      --muted: #4a5266;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; width: 100%;
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; }

  #hud {
    position: fixed; top: 12px; left: 12px; right: 12px;
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    pointer-events: auto; z-index: 5;
  }
  .btn {
    background: var(--panel); color: var(--text);
    border: 1px solid rgba(255,255,255,0.12); border-radius: 10px;
    padding: 8px 12px; font-size: 13px; cursor: pointer;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }
  .btn.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #shapes { display: flex; flex-wrap: wrap; gap: 6px; }
  #status {
    margin-left: auto; background: var(--panel); border-radius: 10px;
    padding: 8px 12px; font-size: 12px; color: var(--muted);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    max-width: 100%;
  }
  #legend {
    position: fixed; bottom: 12px; left: 12px; z-index: 5;
    background: var(--panel); border-radius: 12px; padding: 10px 12px;
    font-size: 12px; line-height: 1.6; color: var(--muted);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  }
  #legend b { color: var(--text); font-weight: 600; }
  #video {
    position: fixed; bottom: 12px; right: 12px; width: 180px; height: 135px;
    border-radius: 12px; object-fit: cover; transform: scaleX(-1);
    border: 1px solid rgba(255,255,255,0.15); opacity: 0.85; z-index: 4;
    display: none;
  }
  #video.show { display: block; }
  #toggleCam { }
  @media (max-width: 600px) {
    #video { width: 120px; height: 90px; }
    #legend { font-size: 11px; }
  }
</style>
</head>
<body>

<div id="stage"></div>

<div id="hud">
  <div id="shapes"></div>
  <button class="btn" id="toggleCam" aria-pressed="false">Enable camera</button>
  <button class="btn" id="colorBtn">Next color</button>
  <div id="status">Loading…</div>
</div>

<div id="legend">
  <b>Gestures</b><br/>
  Open palm ↔ fist: <b>expand / contract</b><br/>
  Pinch (thumb + index): <b>hue shift</b><br/>
  Swipe left/right: <b>previous / next shape</b><br/>
  Two hands apart: <b>scatter force</b><br/>
  Keyboard: 1–9 shapes, C color, Space explode
</div>

<video id="video" playsinline muted></video>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/camera_utils.js" crossorigin="anonymous"></script>

<script type="module">
import * as THREE from "three";

(() => {
  // ---------- Config ----------
  const PARTICLE_COUNT = 9000;
  const SHAPES = [
    'heart', 'flower', 'saturn', 'fireworks', 'sphere',
    'galaxy', 'dna', 'torus', 'rain'
  ];
  const SHAPE_LABELS = {
    heart: 'Heart', flower: 'Flower', saturn: 'Saturn', fireworks: 'Fireworks',
    sphere: 'Sphere', galaxy: 'Galaxy', dna: 'DNA', torus: 'Torus', rain: 'Rain'
  };
  const PALETTES = [
    { name: 'Aurora', colors: [0x7dd3fc, 0xa78bfa, 0x6ee7b7] },
    { name: 'Ember',  colors: [0xfb7185, 0xfbbf24, 0xf97316] },
    { name: 'Ocean',  colors: [0x38bdf8, 0x0ea5e9, 0x22d3ee] },
    { name: 'Rose',   colors: [0xf9a8d4, 0xf472b6, 0xe879f9] },
    { name: 'Mono',   colors: [0xf8fafc, 0xcbd5e1, 0x94a3b8] }
  ];

  // ---------- Status helper ----------
  const statusEl = document.getElementById('status');
  const setStatus = (t) => { statusEl.textContent = t; };

  // ---------- Three.js setup ----------
  const stage = document.getElementById('stage');
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setClearColor(0x05060a, 1);
  stage.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x05060a, 0.035);
  const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200);
  camera.position.set(0, 0, 14);

  // Soft round sprite texture so points look like glowing orbs
  function makeSpriteTexture() {
    const c = document.createElement('canvas');
    c.width = c.height = 64;
    const g = c.getContext('2d');
    const grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    grad.addColorStop(0, 'rgba(255,255,255,1)');
    grad.addColorStop(0.4, 'rgba(255,255,255,0.6)');
    grad.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = grad;
    g.fillRect(0, 0, 64, 64);
    const tex = new THREE.CanvasTexture(c);
    return tex;
  }

  // ---------- Particle buffers ----------
  const positions = new Float32Array(PARTICLE_COUNT * 3);   // current
  const targets   = new Float32Array(PARTICLE_COUNT * 3);   // target template
  const velocities = new Float32Array(PARTICLE_COUNT * 3);
  const colors    = new Float32Array(PARTICLE_COUNT * 3);
  const colorTargets = new Float32Array(PARTICLE_COUNT * 3);
  const seeds     = new Float32Array(PARTICLE_COUNT);       // per-particle randomness

  for (let i = 0; i < PARTICLE_COUNT; i++) {
    seeds[i] = Math.random();
    positions[i * 3]     = (Math.random() - 0.5) * 20;
    positions[i * 3 + 1] = (Math.random() - 0.5) * 20;
    positions[i * 3 + 2] = (Math.random() - 0.5) * 20;
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

  const material = new THREE.PointsMaterial({
    size: 0.09,
    map: makeSpriteTexture(),
    vertexColors: true,
    transparent: true,
    opacity: 0.95,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    sizeAttenuation: true
  });
  const points = new THREE.Points(geometry, material);
  scene.add(points);

  // ---------- Shape generators (return Float32Array of xyz) ----------
  function fillShape(type) {
    const out = new Float32Array(PARTICLE_COUNT * 3);
    for (let i = 0; i < PARTICLE_COUNT; i++) {
      const t = i / PARTICLE_COUNT;
      const u = Math.random();
      const v = Math.random();
      let x = 0, y = 0, z = 0;

      switch (type) {
        case 'heart': {
          // Parametric heart surface with depth
          const a = Math.random() * Math.PI * 2;
          const r = Math.pow(Math.random(), 0.35);
          const hx = 16 * Math.pow(Math.sin(a), 3);
          const hy = 13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a);
          x = hx * 0.28 * r;
          y = hy * 0.28 * r;
          z = (Math.random() - 0.5) * 1.6 * (1 - r * 0.5);
          break;
        }
        case 'flower': {
          // Rose curve petals with layered radius
          const theta = Math.random() * Math.PI * 2;
          const petals = 6;
          const rad = (2.2 + 1.6 * Math.cos(petals * theta)) * Math.pow(Math.random(), 0.5);
          x = rad * Math.cos(theta);
          y = rad * Math.sin(theta);
          z = Math.sin(petals * theta) * 0.8 * Math.random() + (Math.random() - 0.5) * 0.3;
          break;
        }
        case 'saturn': {
          if (u < 0.45) {
            // Planet body
            const phi = Math.acos(2 * v - 1);
            const th = Math.random() * Math.PI * 2;
            const R = 3.2;
            x = R * Math.sin(phi) * Math.cos(th);
            y = R * Math.sin(phi) * Math.sin(th);
            z = R * Math.cos(phi);
          } else {
            // Ring
            const th = Math.random() * Math.PI * 2;
            const rr = 4.6 + Math.random() * 2.4;
            x = rr * Math.cos(th);
            z = rr * Math.sin(th);
            y = (Math.random() - 0.5) * 0.08;
            // Tilt the ring
            const tilt = 0.4;
            const yy = y * Math.cos(tilt) - z * Math.sin(tilt);
            const zz = y * Math.sin(tilt) + z * Math.cos(tilt);
            y = yy; z = zz;
          }
          break;
        }
        case 'fireworks': {
          // Burst from center in many bursts
          const burst = Math.floor(Math.random() * 6);
          const bAng1 = (burst / 6) * Math.PI * 2 + 0.7;
          const bAng2 = Math.random() * Math.PI * 2;
          const bAng3 = Math.acos(2 * Math.random() - 1);
          const rad = 1.5 + Math.random() * 4.2;
          const cx = Math.cos(bAng1) * 3.4;
          const cy = Math.sin(bAng1) * 2.2;
          x = cx + rad * Math.sin(bAng3) * Math.cos(bAng2);
          y = cy + rad * Math.sin(bAng3) * Math.sin(bAng2);
          z = rad * Math.cos(bAng3) * 0.6;
          break;
        }
        case 'sphere': {
          const phi = Math.acos(2 * v - 1);
          const th = u * Math.PI * 2;
          const R = 5 * Math.cbrt(Math.random());
          x = R * Math.sin(phi) * Math.cos(th);
          y = R * Math.sin(phi) * Math.sin(th);
          z = R * Math.cos(phi);
          break;
        }
        case 'galaxy': {
          const arm = i % 3;
          const dist = Math.pow(Math.random(), 1.6) * 7;
          const ang = dist * 0.9 + (arm / 3) * Math.PI * 2 + (Math.random() - 0.5) * 0.4;
          x = Math.cos(ang) * dist;
          z = Math.sin(ang) * dist;
          y = (Math.random() - 0.5) * (0.6 * (1 - dist / 8));
          break;
        }
        case 'dna': {
          const s = t * 14 - 7;
          const strand = i % 2 === 0 ? 0 : Math.PI;
          const ang = s * 1.4 + strand;
          const r = 2.2 + (Math.random() - 0.5) * 0.25;
          x = Math.cos(ang) * r;
          z = Math.sin(ang) * r;
          y = s;
          if (i % 9 === 0) { // rungs
            const k = Math.random();
            x = Math.cos(ang) * r * (1 - 2 * k);
            z = Math.sin(ang) * r * (1 - 2 * k);
          }
          break;
        }
        case 'torus': {
          const a = Math.random() * Math.PI * 2;
          const b = Math.random() * Math.PI * 2;
          const R = 4.2, rr = 1.4;
          x = (R + rr * Math.cos(b)) * Math.cos(a);
          y = rr * Math.sin(b);
          z = (R + rr * Math.cos(b)) * Math.sin(a);
          break;
        }
        case 'rain': {
          // Vertical columns of particles falling, spread wide
          x = (Math.random() - 0.5) * 16;
          z = (Math.random() - 0.5) * 8;
          y = (Math.random() - 0.5) * 12;
          break;
        }
      }
      out[i * 3]     = x;
      out[i * 3 + 1] = y;
      out[i * 3 + 2] = z;
    }
    return out;
  }

  // ---------- State ----------
  const state = {
    shapeIndex: 0,
    paletteIndex: 0,
    expansion: 1.0,       // driven by fist/palm
    expansionTarget: 1.0,
    hueShift: 0,          // driven by pinch
    hueTarget: 0,
    scatter: 0,           // driven by two-hand distance
    scatterTarget: 0,
    rotationY: 0,
    rotationVel: 0.002,
    explode: 0,           // spacebar impulse
    handsSeen: 0,
    swipeCooldown: 0,
    pinchCooldown: 0
  };

  // ---------- Color assignment ----------
  const tmpColor = new THREE.Color();
  function assignColors(paletteIndex, hueShift) {
    const pal = PALETTES[paletteIndex].colors;
    for (let i = 0; i < PARTICLE_COUNT; i++) {
      const base = pal[i % pal.length];
      tmpColor.setHex(base);
      const hsl = {};
      tmpColor.getHSL(hsl);
      tmpColor.setHSL((hsl.h + hueShift + 1) % 1, Math.min(1, hsl.s * 1.1), 0.5 + seeds[i] * 0.25);
      colorTargets[i * 3]     = tmpColor.r;
      colorTargets[i * 3 + 1] = tmpColor.g;
      colorTargets[i * 3 + 2] = tmpColor.b;
    }
  }

  // ---------- Shape switching ----------
  let currentTargets = fillShape(SHAPES[state.shapeIndex]);
  targets.set(currentTargets);
  assignColors(state.paletteIndex, 0);

  function setShape(index) {
    state.shapeIndex = (index + SHAPES.length) % SHAPES.length;
    targets.set(fillShape(SHAPES[state.shapeIndex]));
    state.explode = 1.0;
    updateHud();
  }
  function setPalette(index) {
    state.paletteIndex = (index + PALETTES.length) % PALETTES.length;
    assignColors(state.paletteIndex, state.hueShift);
    updateHud();
  }

  // ---------- HUD ----------
  const shapesEl = document.getElementById('shapes');
  SHAPES.forEach((s, idx) => {
    const b = document.createElement('button');
    b.className = 'btn';
    b.textContent = `${idx + 1} ${SHAPE_LABELS[s]}`;
    b.dataset.index = idx;
    b.addEventListener('click', () => setShape(idx));
    shapesEl.appendChild(b);
  });
  const colorBtn = document.getElementById('colorBtn');
  colorBtn.addEventListener('click', () => setPalette(state.paletteIndex + 1));

  function updateHud() {
    [...shapesEl.children].forEach((el, i) => el.classList.toggle('active', i === state.shapeIndex));
    colorBtn.textContent = `Color: ${PALETTES[state.paletteIndex].name}`;
  }
  updateHud();

  // ---------- Keyboard ----------
  window.addEventListener('keydown', (e) => {
    if (e.key >= '1' && e.key <= '9') setShape(parseInt(e.key, 10) - 1);
    else if (e.key === 'c' || e.key === 'C') setPalette(state.paletteIndex + 1);
    else if (e.code === 'Space') { e.preventDefault(); state.explode = 1.0; }
  });

  // ---------- Gesture recognition ----------
  const video = document.getElementById('video');
  const toggleCamBtn = document.getElementById('toggleCam');
  let handsModel = null;
  let cameraUtil = null;
  let cameraOn = false;
  let prevWristX = null;
  let swipeAccum = 0;

  // Count extended fingers from landmarks
  function fingerExtension(lm) {
    // tips: 8,12,16,20 vs pip joints 6,10,14,18
    const wrist = lm[0];
    const tips = [8, 12, 16, 20];
    const pips = [6, 10, 14, 18];
    let ext = 0;
    for (let k = 0; k < 4; k++) {
      const dTip = dist(lm[tips[k]], wrist);
      const dPip = dist(lm[pips[k]], wrist);
      if (dTip > dPip * 1.15) ext++;
    }
    return ext / 4; // 0..1
  }
  function dist(a, b) {
    const dx = a.x - b.x, dy = a.y - b.y, dz = (a.z || 0) - (b.z || 0);
    return Math.sqrt(dx * dx + dy * dy + dz * dz);
  }

  function onHandResults(results) {
    const hands = results.multiHandLandmarks || [];
    state.handsSeen = hands.length;

    if (hands.length === 0) {
      prevWristX = null;
      state.expansionTarget = 1.0;
      state.scatterTarget = 0;
      return;
    }

    const primary = hands[0];
    const openness = fingerExtension(primary);
    // Open palm expands, fist contracts
    state.expansionTarget = 0.5 + openness * 1.6;

    // Pinch: thumb tip (4) and index tip (8) distance -> hue shift
    const pinch = dist(primary[4], primary[8]);
    if (pinch < 0.05) {
      state.hueTarget = (state.hueTarget + 0.002) % 1;
    }

    // Swipe: horizontal wrist velocity
    const wristX = primary[0].x;
    if (prevWristX !== null) {
      const dx = wristX - prevWristX;
      swipeAccum += dx;
      if (state.swipeCooldown <= 0) {
        if (swipeAccum > 0.22) { setShape(state.shapeIndex + 1); swipeAccum = 0; state.swipeCooldown = 40; }
        else if (swipeAccum < -0.22) { setShape(state.shapeIndex - 1); swipeAccum = 0; state.swipeCooldown = 40; }
      }
      swipeAccum *= 0.85;
    }
    prevWristX = wristX;

    // Two hands: distance controls scatter force
    if (hands.length >= 2) {
      const d = dist(hands[0][0], hands[1][0]);
      state.scatterTarget = Math.min(1, Math.max(0, (d - 0.15) * 2.5));
    } else {
      state.scatterTarget = 0;
    }
  }

  function initHands() {
    if (typeof Hands === 'undefined') {
      setStatus('Hand tracking library failed to load. Mouse and keyboard still work.');
      return;
    }
    handsModel = new Hands({
      locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/${f}`
    });
    handsModel.setOptions({
      maxNumHands: 2,
      modelComplexity: 1,
      minDetectionConfidence: 0.6,
      minTrackingConfidence: 0.5
    });
    handsModel.onResults(onHandResults);
  }

  async function startCamera() {
    if (cameraOn) return;
    try {
      if (!handsModel) initHands();
      if (!handsModel) return;
      setStatus('Starting camera…');
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { width: 640, height: 480, facingMode: 'user' }, audio: false
      });
      video.srcObject = stream;
      await video.play();
      video.classList.add('show');
      cameraUtil = new Camera(video, {
        onFrame: async () => { await handsModel.send({ image: video }); },
        width: 640, height: 480
      });
      await cameraUtil.start();
      cameraOn = true;
      toggleCamBtn.textContent = 'Disable camera';
      toggleCamBtn.setAttribute('aria-pressed', 'true');
      setStatus('Camera on. Show your hand.');
    } catch (err) {
      console.error(err);
      setStatus('Camera unavailable: ' + (err.name || 'error') + '. Use keyboard/mouse.');
    }
  }

  function stopCamera() {
    if (!cameraOn) return;
    try { cameraUtil && cameraUtil.stop(); } catch (_) {}
    if (video.srcObject) {
      video.srcObject.getTracks().forEach(t => t.stop());
      video.srcObject = null;
    }
    video.classList.remove('show');
    cameraOn = false;
    state.expansionTarget = 1.0;
    state.scatterTarget = 0;
    toggleCamBtn.textContent = 'Enable camera';
    toggleCamBtn.setAttribute('aria-pressed', 'false');
    setStatus('Camera off.');
  }

  toggleCamBtn.addEventListener('click', () => cameraOn ? stopCamera() : startCamera());

  // Mouse fallback: drag to rotate, wheel to expand
  let dragging = false, lastX = 0;
  renderer.domElement.addEventListener('pointerdown', (e) => { dragging = true; lastX = e.clientX; });
  window.addEventListener('pointerup', () => dragging = false);
  window.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    state.rotationVel = (e.clientX - lastX) * 0.0004;
    lastX = e.clientX;
  });
  window.addEventListener('wheel', (e) => {
    state.expansionTarget = Math.min(2.5, Math.max(0.3, state.expansionTarget - e.deltaY * 0.001));
  }, { passive: true });

  // ---------- Animation loop ----------
  const clock = new THREE.Clock();
  const tmpV = new THREE.Vector3();

  function animate() {
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.05);

    // Smooth gesture-driven parameters
    state.expansion += (state.expansionTarget - state.expansion) * 0.08;
    state.hueShift += (state.hueTarget - state.hueShift) * 0.05;
    state.scatter += (state.scatterTarget - state.scatter) * 0.1;
    if (state.swipeCooldown > 0) state.swipeCooldown--;
    if (state.explode > 0) state.explode *= 0.94;

    // Gentle auto-rotation with drag/gesture influence
    state.rotationVel *= 0.96;
    state.rotationVel += (0.0025 - state.rotationVel) * 0.02;
    points.rotation.y += state.rotationVel;
    points.rotation.x = Math.sin(clock.elapsedTime * 0.2) * 0.12;

    // Recolor periodically when hue shifts
    if (Math.abs(state.hueShift - (state._lastHue ?? -1)) > 0.01) {
      assignColors(state.paletteIndex, state.hueShift);
      state._lastHue = state.hueShift;
    }

    const pos = geometry.attributes.position.array;
    const col = geometry.attributes.color.array;
    const t = clock.elapsedTime;
    const spring = 0.06;
    const damping = 0.86;
    const exp = state.expansion;
    const scat = state.scatter;
    const boom = state.explode;

    for (let i = 0; i < PARTICLE_COUNT; i++) {
      const i3 = i * 3;
      const s = seeds[i];

      // Desired position: template scaled by expansion, with breathing and noise
      const breathe = 1 + Math.sin(t * 1.5 + s * 6.28) * 0.04;
      let tx = targets[i3]     * exp * breathe;
      let ty = targets[i3 + 1] * exp * breathe;
      let tz = targets[i3 + 2] * exp * breathe;

      // Scatter: push outward from center along a noise direction
      if (scat > 0.001) {
        const nx = Math.sin(s * 91.7 + t) , ny = Math.cos(s * 37.3 - t), nz = Math.sin(s * 13.1 + t * 0.7);
        tx += nx * scat * 6;
        ty += ny * scat * 6;
        tz += nz * scat * 6;
      }

      // Explosion impulse on shape change or spacebar
      if (boom > 0.01) {
        const k = boom * 3;
        velocities[i3]     += (Math.sin(s * 53.1) ) * k;
        velocities[i3 + 1] += (Math.cos(s * 71.9) ) * k;
        velocities[i3 + 2] += (Math.sin(s * 17.3) ) * k;
      }

      // Spring toward target
      velocities[i3]     += (tx - pos[i3])     * spring;
      velocities[i3 + 1] += (ty - pos[i3 + 1]) * spring;
      velocities[i3 + 2] += (tz - pos[i3 + 2]) * spring;

      velocities[i3]     *= damping;
      velocities[i3 + 1] *= damping;
      velocities[i3 + 2] *= damping;

      pos[i3]     += velocities[i3];
      pos[i3 + 1] += velocities[i3 + 1];
      pos[i3 + 2] += velocities[i3 + 2];

      // Color lerp toward target palette
      col[i3]     += (colorTargets[i3]     - col[i3])     * 0.05;
      col[i3 + 1] += (colorTargets[i3 + 1] - col[i3 + 1]) * 0.05;
      col[i3 + 2] += (colorTargets[i3 + 2] - col[i3 + 2]) * 0.05;
    }

    geometry.attributes.position.needsUpdate = true;
    geometry.attributes.color.needsUpdate = true;

    // Size reacts to expansion for a subtle pulse
    material.size = 0.08 + 0.03 * Math.sin(t * 2) + 0.02 * state.expansion;

    renderer.render(scene, camera);
  }
  animate();

  // ---------- Resize ----------
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  setStatus('Ready. Click "Enable camera" for gestures, or use keyboard.');
})();
</script>
</body>
</html>
